name: False alarm
description: A finding that is not a real problem
labels: [false-positive]
body:
  - type: input
    id: rule
    attributes:
      label: Rule id
      placeholder: padding
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it is not a real problem
      description: What the page does, and the icon and why the finding does not matter (an SVG snippet helps). Share a public URL only if you are fine with it being public.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "npx @selzerey/zoro-icons --version"
